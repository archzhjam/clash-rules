# Clash Verge / Verge Rev Merge 配置
# 用法：Clash Verge Rev → 订阅(配置) → 编辑 → 新建 Merge 配置，
#       把下方内容粘贴进去并启用；Verge 会自动把这段合并进订阅生成的配置。
# 策略组名需与订阅配置中已定义的组一致。

prepend-rules:
  # 共享规则集引用（顺序与原文件一致）
  - RULE-SET,netflix,🎥 Netflix
  - RULE-SET,direct,🎯 Direct
  - RULE-SET,microsoft,Ⓜ️ Microsoft
  - RULE-SET,apple,🍎 Apple
  - RULE-SET,telegram,📲 Telegram
  - RULE-SET,bilibili,📺 BiliBili
  - RULE-SET,media,🌍 主流媒体
  - RULE-SET,tiktok,tiktok
  - RULE-SET,block,🛑 Block
  - GEOIP,CN,🎯 Direct
  - GEOSITE,CN,🎯 Direct
  # 桌面端进程规则（Windows/macOS 独有）
  - RULE-SET,process,🎯 Direct

prepend-rule-providers:
  netflix: {type: http, behavior: classical, url: "https://raw.githubusercontent.com/archzhjam/clash-rules/main/rules/netflix.list", path: ./rules/netflix.yaml, interval: 86400}
  direct: {type: http, behavior: classical, url: "https://raw.githubusercontent.com/archzhjam/clash-rules/main/rules/direct.list", path: ./rules/direct.yaml, interval: 86400}
  microsoft: {type: http, behavior: classical, url: "https://raw.githubusercontent.com/archzhjam/clash-rules/main/rules/microsoft.list", path: ./rules/microsoft.yaml, interval: 86400}
  apple: {type: http, behavior: classical, url: "https://raw.githubusercontent.com/archzhjam/clash-rules/main/rules/apple.list", path: ./rules/apple.yaml, interval: 86400}
  telegram: {type: http, behavior: classical, url: "https://raw.githubusercontent.com/archzhjam/clash-rules/main/rules/telegram.list", path: ./rules/telegram.yaml, interval: 86400}
  bilibili: {type: http, behavior: classical, url: "https://raw.githubusercontent.com/archzhjam/clash-rules/main/rules/bilibili.list", path: ./rules/bilibili.yaml, interval: 86400}
  media: {type: http, behavior: classical, url: "https://raw.githubusercontent.com/archzhjam/clash-rules/main/rules/media.list", path: ./rules/media.yaml, interval: 86400}
  tiktok: {type: http, behavior: classical, url: "https://raw.githubusercontent.com/archzhjam/clash-rules/main/rules/tiktok.list", path: ./rules/tiktok.yaml, interval: 86400}
  block: {type: http, behavior: classical, url: "https://raw.githubusercontent.com/archzhjam/clash-rules/main/rules/block.list", path: ./rules/block.yaml, interval: 86400}
  process: {type: http, behavior: classical, url: "https://raw.githubusercontent.com/archzhjam/clash-rules/main/rules/process.list", path: ./rules/process.yaml, interval: 86400}
